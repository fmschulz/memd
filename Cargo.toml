[workspace]
members = ["crates/*", "evals/harness"]
resolver = "2"

[workspace.package]
version = "1.5.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util", "process"] }
futures-util = "0.3"
async-trait = "0.1"
sha2 = "0.10"
tempfile = "3.10"
memmap2 = "0.9"
rusqlite = { version = "0.38", features = ["bundled"] }
roaring = "0.11"
crc32fast = "1.4"
bincode = { version = "2", features = ["serde"] }
byteorder = "1.5"
parking_lot = "0.12"
# Candle dependencies for embeddings
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
# ONNX dependencies (feature-gated in crates)
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic", "download-binaries", "tls-native"] }
ndarray = "0.17"
hnsw_rs = "0.3"
anndists = "0.1"
half = { version = "2.4", features = ["serde"] }
ureq = "2.10"
dirs = "5.0"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tantivy = "0.24"
rust-stemmers = "1.2"
unicode-segmentation = "1.12"
moka = { version = "0.12", features = ["sync"] }
# Tree-sitter for structural parsing
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
regex = "1.10"
flate2 = "1.0"
tar = "0.4"
libc = "0.2"

# Distribution profile: smaller, faster binary for releases.
# strip removes symbols; thin LTO + single codegen unit maximize
# optimization (at the cost of slower release builds — debug/test
# builds are unaffected).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
