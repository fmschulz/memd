[package]
name = "memd-evals"
version = "0.1.0"
edition = "2021"
description = "Evaluation harness for memd CLI contract and retrieval tests"

# Internal-only eval harness: never ship it as a release artifact. Only `memd` is dist'd.
[package.metadata.dist]
dist = false

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
rand = "0.8"
sha2 = { workspace = true }
memd = { path = "../../crates/memd" }
