[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Linux is musl-ONLY by design: static musl binaries fix the `GLIBC_x.xx not found`
# class on old/HPC hosts AND sidestep the shell installer's inability to pick
# musl-vs-glibc (cargo-dist issue #75). macOS arm64+x64. Windows deferred (memd
# spawns claude/codex and assumes ~/.local/bin — Unix-leaning).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in (matches the existing memd convention).
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
