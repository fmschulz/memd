name: Refresh bundled skill binary

# When a release tag is pushed, rebuild memd from the tag, copy the linux-x64
# binary into memd-skill/bin/linux-x64/memd, and open a PR to bump it on main.
# A PR (not a direct push) keeps the skill-binary commit reviewable and avoids
# fighting with branch protection.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or commit) to build the bundled binary from'
        required: true
        default: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-binary:
    name: Build linux-x64 release binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release -p memd

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BIN_VERSION="$(./target/release/memd --version | awk '{print $2}')"
          if [[ "${TAG_VERSION}" != "${BIN_VERSION}" ]]; then
            echo "version mismatch: tag=${TAG_VERSION} binary=${BIN_VERSION}" >&2
            exit 1
          fi

      - name: Strip binary
        run: strip target/release/memd

      - name: Stage updated skill binary
        run: |
          mkdir -p memd-skill/bin/linux-x64
          cp target/release/memd memd-skill/bin/linux-x64/memd
          chmod +x memd-skill/bin/linux-x64/memd

      - name: Open PR with refreshed binary
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            chore(skill): refresh bundled binary for ${{ steps.ref.outputs.ref }}

            Rebuilt memd-skill/bin/linux-x64/memd from ${{ steps.ref.outputs.ref }}.
            Verified that the binary's --version matches the tag.
          title: "chore(skill): refresh bundled binary for ${{ steps.ref.outputs.ref }}"
          body: |
            This PR was opened automatically by the **Refresh bundled skill binary** workflow
            after the tag `${{ steps.ref.outputs.ref }}` was pushed.

            - Built `cargo build --release -p memd` from the tag.
            - Stripped and copied the result to `memd-skill/bin/linux-x64/memd`.
            - Verified `memd --version` matches the tag.

            Merge to keep the bundled skill binary version-aligned with the latest release.
          branch: chore/skill-binary-${{ steps.ref.outputs.ref }}
          base: main
          add-paths: |
            memd-skill/bin/linux-x64/memd
          delete-branch: true
          labels: |
            chore
            skill
            automated
